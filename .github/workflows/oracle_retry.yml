name: Oracle Cloud Free Tier Auto-Retry

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-vm-claim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claim-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Retry Script
        env:
          SINGLE_RUN: "true"
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
        run: |
          python main.py
