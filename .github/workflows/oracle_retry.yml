name: Oracle Cloud Free Tier Auto-Retry

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-vm-claim
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  claim-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Retry Script
        id: retry
        env:
          SINGLE_RUN: "true"
          OCI_CONFIG_JSON: ${{ secrets.OCI_CONFIG_JSON }}
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
        run: |
          python main.py

      - name: Dispatch Next Run (Unstoppable Chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/vm_created ]; then
            echo "🎉 VM created or already exists! Stopping auto-loop."
          else
            echo "🔄 Dispatching next workflow run..."
            sleep 10
            gh workflow run oracle_retry.yml --repo ${{ github.repository }} || true
          fi
